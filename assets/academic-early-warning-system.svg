<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title description"><title id="svg-title">Academic Early Warning System</title><desc id="description">A customer presentation of the implemented synthetic demonstration and the adaptation path for institutional data. Historical outcomes train a selected four-class model. Current students use the same early features, with global and individual explanations.</desc><defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#0078a8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><g font-family="Segoe UI, Aptos, Calibri, Arial, sans-serif"><text id="title" data-max-width="1800" x="60" y="84" font-size="49" fill="#000000" font-weight="650"><tspan x="60" dy="0">Academic Early Warning System</tspan></text><text id="subtitle" data-max-width="1800" x="60" y="131" font-size="26" fill="#000000"><tspan x="60" dy="0">Learn from historical outcomes. Identify earlier signals. Explain the next prediction.</tspan></text><rect x="60" y="165" width="200" height="48" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="outcome-label-0" data-max-width="160" x="80" y="196" font-size="22" fill="#000000" font-weight="650"><tspan x="80" dy="0">Excellent</tspan></text><rect x="280" y="165" width="200" height="48" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="outcome-label-1" data-max-width="160" x="300" y="196" font-size="22" fill="#000000" font-weight="650"><tspan x="300" dy="0">Pass</tspan></text><rect x="500" y="165" width="200" height="48" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="outcome-label-2" data-max-width="160" x="520" y="196" font-size="22" fill="#000000" font-weight="650"><tspan x="520" dy="0">Fail</tspan></text><rect x="720" y="165" width="200" height="48" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="outcome-label-3" data-max-width="160" x="740" y="196" font-size="22" fill="#000000" font-weight="650"><tspan x="740" dy="0">Withdrawn</tspan></text><text id="outcome-caption" data-max-width="840" x="990" y="196" font-size="23" fill="#000000"><tspan x="990" dy="0">Four outcomes. One model. Evidence for every result.</tspan></text><rect x="420" y="248" width="1440" height="565" rx="16" fill="none" stroke="#86afc3" stroke-width="2"/><text id="fabric-label" data-max-width="1200" x="450" y="279" font-size="17" fill="#000000" font-weight="650"><tspan x="450" dy="0">MICROSOFT FABRIC + ONELAKE</tspan></text><rect x="60" y="315" width="290" height="190" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="synthetic-title" data-max-width="242" x="84" y="367" font-size="28" fill="#000000" font-weight="650"><tspan x="84" dy="0">Demo data</tspan></text><text id="synthetic-body" data-max-width="242" x="84" y="414" font-size="21" fill="#000000"><tspan x="84" dy="0">Canvas-shaped records</tspan><tspan x="84" dy="29.4">Fictional student histories</tspan><tspan x="84" dy="29.4">Known course outcomes</tspan></text><rect x="60" y="610" width="290" height="195" rx="16" fill="#ffffff" stroke="#0078a8" stroke-width="2" stroke-dasharray="9 7"/><text id="institution-title" data-max-width="242" x="84" y="662" font-size="28" fill="#000000" font-weight="650"><tspan x="84" dy="0">Your institution</tspan></text><text id="institution-body" data-max-width="242" x="84" y="709" font-size="21" fill="#000000"><tspan x="84" dy="0">Map Canvas / ODS records</tspan><tspan x="84" dy="29.4">Confirm outcomes and dates</tspan><tspan x="84" dy="29.4">Adapt the supplied code</tspan></text><rect x="470" y="315" width="350" height="220" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="features-number" data-max-width="302" x="494" y="348" font-size="15" fill="#000000" font-weight="650"><tspan x="494" dy="0">01 / REWIND</tspan></text><text id="features-title" data-max-width="302" x="494" y="391" font-size="28" fill="#000000" font-weight="650"><tspan x="494" dy="0">Earlier observations</tspan></text><text id="features-body" data-max-width="302" x="494" y="433" font-size="21" fill="#000000"><tspan x="494" dy="0">Grades and grade changes</tspan><tspan x="494" dy="29.4">Completion, late/missing work</tspan><tspan x="494" dy="29.4">Engagement before the cutoff</tspan></text><rect x="910" y="315" width="355" height="220" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="learn-number" data-max-width="307" x="934" y="348" font-size="15" fill="#000000" font-weight="650"><tspan x="934" dy="0">02 / LEARN</tspan></text><text id="learn-title" data-max-width="307" x="934" y="391" font-size="28" fill="#000000" font-weight="650"><tspan x="934" dy="0">Contributing features</tspan></text><text id="learn-body" data-max-width="307" x="934" y="433" font-size="21" fill="#000000"><tspan x="934" dy="0">Compare known outcome groups</tspan><tspan x="934" dy="29.4">Fit and assess candidate models</tspan><tspan x="934" dy="29.4">See feature importance by class</tspan></text><rect x="1360" y="315" width="445" height="220" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="model-number" data-max-width="397" x="1384" y="348" font-size="15" fill="#000000" font-weight="650"><tspan x="1384" dy="0">03 / SELECT</tspan></text><text id="model-title" data-max-width="397" x="1384" y="391" font-size="28" fill="#000000" font-weight="650"><tspan x="1384" dy="0">One four-outcome model</tspan></text><text id="model-body" data-max-width="397" x="1384" y="433" font-size="21" fill="#000000"><tspan x="1384" dy="0">Keep the fitted transforms + model</tspan><tspan x="1384" dy="29.4">Return a probability for each outcome</tspan><tspan x="1384" dy="29.4">Check performance for every class</tspan></text><polyline points="350,410 470,410" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><polyline points="350,705 395,705 395,490 470,490" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)" stroke-dasharray="9 7"/><polyline points="820,410 910,410" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><polyline points="1265,410 1360,410" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="910" y="620" width="355" height="155" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="score-title" data-max-width="307" x="934" y="672" font-size="28" fill="#000000" font-weight="650"><tspan x="934" dy="0">Predict outcomes</tspan></text><text id="score-body" data-max-width="307" x="934" y="719" font-size="21" fill="#000000"><tspan x="934" dy="0">Use the same earlier features</tspan><tspan x="934" dy="29.4">Reuse the fitted model</tspan></text><rect x="1360" y="620" width="445" height="155" rx="16" fill="#e7f5fb" stroke="#0078a8" stroke-width="2"/><text id="explain-title" data-max-width="397" x="1384" y="672" font-size="28" fill="#000000" font-weight="650"><tspan x="1384" dy="0">Explain the result</tspan></text><text id="explain-body" data-max-width="397" x="1384" y="719" font-size="21" fill="#000000"><tspan x="1384" dy="0">Predicted outcome + four probabilities</tspan><tspan x="1384" dy="29.4">Observed inputs + contributing features</tspan></text><polyline points="820,485 865,485 865,698 910,698" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><text id="current-branch-label" data-max-width="400" x="490" y="624" font-size="20" fill="#000000"><tspan x="490" dy="0">Historical outcomes teach the model.</tspan><tspan x="490" dy="28.0">Current students supply inputs only.</tspan></text><polyline points="1580,535 1580,575 1085,575 1085,620" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><text id="reuse-label" data-max-width="340" x="1160" y="565" font-size="18" fill="#000000"><tspan x="1160" dy="0">Reuse, not retrain</tspan></text><polyline points="1265,698 1360,698" fill="none" stroke="#0078a8" stroke-width="3" marker-end="url(#arrowhead)"/><rect x="60" y="865" width="1800" height="140" rx="16" fill="none" stroke="#86afc3" stroke-width="2"/><text id="train-view-title" data-max-width="530" x="85" y="905" font-size="17" fill="#000000" font-weight="650"><tspan x="85" dy="0">TRAINING VIEW</tspan></text><text id="train-view" data-max-width="530" x="85" y="948" font-size="23" fill="#000000"><tspan x="85" dy="0">Which features contribute</tspan><tspan x="85" dy="32.199999999999996">across the historical population?</tspan></text><text id="student-view-title" data-max-width="535" x="690" y="905" font-size="17" fill="#000000" font-weight="650"><tspan x="690" dy="0">STUDENT VIEW</tspan></text><text id="student-view" data-max-width="535" x="690" y="948" font-size="23" fill="#000000"><tspan x="690" dy="0">What contributed to this prediction,</tspan><tspan x="690" dy="32.199999999999996">and what was actually observed?</tspan></text><text id="replicate-title" data-max-width="535" x="1295" y="905" font-size="17" fill="#000000" font-weight="650"><tspan x="1295" dy="0">REPLICATE WITH YOUR DATA</tspan></text><text id="replicate" data-max-width="535" x="1295" y="948" font-size="23" fill="#000000"><tspan x="1295" dy="0">Map sources, rebuild features,</tspan><tspan x="1295" dy="32.199999999999996">retrain and evaluate unseen cohorts.</tspan></text><text id="footnote" data-max-width="1800" x="60" y="1047" font-size="17" fill="#000000"><tspan x="60" dy="0">Synthetic demonstration, not an accepted institutional predictor. Dashed path: customer adapter required. Explanations support human review, not causal claims.</tspan></text></g></svg>